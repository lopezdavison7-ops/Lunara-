<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil | Lunara</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="profile-container">


    <header class="profile-header">

        <h1>
            🌙 Mi Perfil
        </h1>


        <a href="dashboard.html">
            ← Volver al dashboard
        </a>

    </header>




    <main class="profile-card">


        <div class="avatar">

            👤

        </div>



        <h2 id="username">
            Usuario
        </h2>



        <p id="email">
            correo@ejemplo.com
        </p>




        <div class="profile-info">


            <div>

                <span>
                    Plan:
                </span>

                <strong id="plan">
                    Free
                </strong>

            </div>




            <div>

                <span>
                    Fecha de registro:
                </span>

                <strong id="created">
                    --
                </strong>

            </div>



        </div>



        <button id="logout">

            Cerrar sesión

        </button>



    </main>


</div>



<script src="profile.js"></script>


</body>

</html>
