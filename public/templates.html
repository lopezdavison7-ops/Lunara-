<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plantillas | Lunara</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="templates-container">


    <header class="templates-header">

        <h1>
            🌙 Plantillas Lunara
        </h1>


        <p>
            Elige un estilo para tu detalle especial.
        </p>


        <a href="dashboard.html">
            ← Volver
        </a>

    </header>




    <main class="templates-grid">



        <div class="template-card">

            <h2>
                ❤️ Amor
            </h2>

            <p>
                Diseños románticos con animaciones suaves.
            </p>

            <button data-template="amor">
                Usar plantilla
            </button>

        </div>





        <div class="template-card">

            <h2>
                🌷 Día de las Madres
            </h2>

            <p>
                Detalles especiales para mamá.
            </p>

            <button data-template="madres">
                Usar plantilla
            </button>

        </div>





        <div class="template-card">

            <h2>
                🎂 Cumpleaños
            </h2>

            <p>
                Felicitaciones con efectos y música.
            </p>

            <button data-template="cumpleanos">
                Usar plantilla
            </button>

        </div>





        <div class="template-card">

            <h2>
                💍 Aniversario
            </h2>

            <p>
                Momentos únicos para celebrar.
            </p>

            <button data-template="aniversario">
                Usar plantilla
            </button>

        </div>




    </main>


</div>



<script src="templates.js"></script>


</body>

</html>
