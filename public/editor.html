<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor | Lunara</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="editor.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="editor-container">

    <aside class="sidebar">

        <h2>🌙 Lunara</h2>

        <button class="tool">
            📷 Agregar fotos
        </button>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            multiple
        >

        <button class="tool">
            🎵 Agregar música
        </button>

        <input
            type="file"
            id="musicInput"
            accept="audio/*"
        >

        <button class="tool">
            ✍️ Mensaje
        </button>

        <input

            id="textInput"

            type="text"

            placeholder="Escribe tu mensaje..."

        >

        <button class="tool">

            ❤️ Corazones

        </button>

        <button class="tool">

            ✨ Partículas

        </button>

        <button class="tool">

            🌸 Pétalos

        </button>

        <button class="tool">

            🎆 Fuegos Artificiales

        </button>

    </aside>

    <main class="workspace">

        <div class="canvas">

            <img

                id="previewImage"

                src="https://placehold.co/400x700"

                alt="Vista previa"

            >

            <div

                id="previewText"

                class="canvas-text"

            >

                Tu mensaje aparecerá aquí

            </div>

        </div>

    </main>

</div>

<div class="topbar">

    <button

        onclick="saveProject()"

        class="btn"

    >

        💾 Guardar

    </button>

    <button

        onclick="generateVideo()"

        class="btn"

    >

        🎬 Generar Video

    </button>

</div>

<audio

    id="previewMusic"

    controls

    style="display:none;"

></audio>

<script src="editor.js"></script>
<script src="effects.js"></script>
<script src="particles.js"></script>

</body>

</html>
