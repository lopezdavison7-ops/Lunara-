<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Lunara</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🌙 Lunara</h1>

        <p>
            Entra a tu cuenta y continúa creando momentos únicos.
        </p>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >


            <button type="submit">
                Iniciar sesión
            </button>


        </form>


        <p class="auth-link">

            ¿No tienes cuenta?

            <a href="register.html">
                Crear cuenta
            </a>

        </p>


    </div>

</div>


<script src="login.js"></script>

</body>

</html>
