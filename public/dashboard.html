<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Lunara</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">


    <header class="dashboard-header">

        <div>

            <h1>🌙 Lunara</h1>

            <p id="welcome">
                Bienvenido
            </p>

        </div>


        <button id="logout">
            Cerrar sesión
        </button>


    </header>



    <main class="dashboard-content">


        <section class="dashboard-card create-card">


            <h2>
                Crear nuevo detalle
            </h2>


            <p>
                Diseña un momento especial con fotos,
                música y animaciones.
            </p>


            <a href="editor.html" class="btn">
                Crear ahora
            </a>


        </section>




        <section class="dashboard-card">


            <h2>
                Mis proyectos
            </h2>


            <div id="projects">

                <p>
                    Cargando proyectos...
                </p>

            </div>


        </section>




        <section class="dashboard-card">


            <h2>
                Tu plan
            </h2>


            <p>
                🆓 Plan Free
            </p>


            <a href="plans.html" class="btn">
                Ver planes
            </a>


        </section>


    </main>


</div>



<script src="dashboard.js"></script>


</body>

</html>
