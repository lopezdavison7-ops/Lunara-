<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subir archivos | Lunara</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="upload-container">

    <h1>🌙 Subir archivos</h1>

    <p>
        Agrega las fotos que formarán parte de tu detalle.
    </p>

    <form id="uploadForm">

        <input
            type="file"
            id="images"
            accept="image/*"
            multiple
        >

        <button type="submit">

            Subir imágenes

        </button>

    </form>

    <div id="gallery">

    </div>

    <a href="editor.html">

        ← Volver al editor

    </a>

</div>

<script src="upload.js"></script>

</body>

</html>
