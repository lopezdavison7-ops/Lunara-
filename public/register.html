<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Lunara</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🌙 Lunara</h1>

        <p>
            Crea tu cuenta y comienza a crear detalles increíbles.
        </p>


        <form id="registerForm">

            <input 
                type="text"
                id="username"
                placeholder="Nombre de usuario"
                required
            >


            <input 
                type="email"
                id="email"
                placeholder="Correo electrónico"
                required
            >


            <input 
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >


            <button type="submit">
                Crear cuenta
            </button>

        </form>


        <p class="auth-link">

            ¿Ya tienes cuenta?

            <a href="login.html">
                Inicia sesión
            </a>

        </p>


    </div>

</div>


<script src="register.js"></script>

</body>

</html>
